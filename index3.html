<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPass Generator // Neon Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#030712',
                            card: '#090d16',
                            neonCyan: '#00f0ff',
                            neonPink: '#ff007f',
                            neonGreen: '#39ff14',
                            neonPurple: '#a855f7',
                            neonYellow: '#fae853'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
        }

        /* Neon Glow Utility Classes */
        .glow-cyan {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .glow-pink {
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4), inset 0 0 10px rgba(255, 0, 127, 0.2);
        }
        .glow-btn {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6), 0 0 10px rgba(255, 0, 127, 0.4);
        }
        .text-glow-cyan {
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
        }
        .text-glow-pink {
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.8);
        }
        .text-glow-green {
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.8);
        }

        /* Background Animated Glow Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: #0f172a;
            height: 12px;
            border-radius: 6px;
            border: 1px solid #00f0ff66;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff;
            cursor: pointer;
            border: 2px solid #ffffff;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* Cyber Custom Checkbox */
        .cyber-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            background: #090d16;
            border: 2px solid #00f0ff;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .cyber-checkbox:checked {
            background: #ff007f;
            border-color: #ff007f;
            box-shadow: 0 0 12px #ff007f;
        }
        .cyber-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #ffffff;
            font-weight: 900;
            font-size: 14px;
            left: 4px;
            top: -2px;
        }

        /* Scanline Overlay */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.4) 50%,
                rgba(0, 0, 0, 0.4)
            );
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="min-h-screen bg-cyber-bg flex flex-col justify-between relative scanlines">

    <!-- Neon Ambient Blobs -->
    <div class="blob w-96 h-96 bg-cyber-neonCyan top-10 -left-20 animate-pulse"></div>
    <div class="blob w-96 h-96 bg-cyber-neonPink bottom-10 -right-20 animate-pulse" style="animation-delay: 1s;"></div>
    <div class="blob w-80 h-80 bg-cyber-neonPurple top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-20"></div>

    <!-- Header Grid Line -->
    <div class="h-1 w-full bg-gradient-to-r from-cyber-neonCyan via-cyber-neonPink to-cyber-neonGreen shadow-[0_0_20px_#00f0ff]"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-72 opacity-0 transition-all duration-300 bg-cyber-card border border-cyber-neonGreen px-4 py-3 rounded-lg shadow-[0_0_20px_#39ff14] flex items-center gap-3">
        <i class="fa-solid fa-check-circle text-cyber-neonGreen text-xl"></i>
        <span class="text-sm font-bold text-white tracking-wide">Скопировано в буфер!</span>
    </div>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-8 max-w-2xl my-auto relative z-10">
        
        <!-- App Title -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-3 py-1 bg-cyber-neonPink/10 border border-cyber-neonPink/50 rounded-full text-cyber-neonPink text-xs font-bold uppercase tracking-widest mb-3 shadow-[0_0_10px_rgba(255,0,127,0.3)]">
                <i class="fa-solid fa-shield-halved animate-pulse"></i> CYBER SECURITY LABS
            </div>
            <h1 class="text-3xl sm:text-5xl font-black font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-cyber-neonCyan via-white to-cyber-neonPink tracking-wider uppercase text-glow-cyan">
                CYBERPASS // GEN
            </h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-2 font-mono">Генерация сверхстойких неоновых паролей</p>
        </header>

        <!-- Main Card -->
        <div class="bg-cyber-card/90 backdrop-blur-md border-2 border-cyber-neonCyan/40 rounded-2xl p-6 sm:p-8 glow-cyan relative">
            
            <!-- Tech Corners -->
            <div class="absolute -top-2 -left-2 w-4 h-4 border-t-2 border-l-2 border-cyber-neonCyan"></div>
            <div class="absolute -top-2 -right-2 w-4 h-4 border-t-2 border-r-2 border-cyber-neonCyan"></div>
            <div class="absolute -bottom-2 -left-2 w-4 h-4 border-b-2 border-l-2 border-cyber-neonCyan"></div>
            <div class="absolute -bottom-2 -right-2 w-4 h-4 border-b-2 border-r-2 border-cyber-neonCyan"></div>

            <!-- Parameters Section -->
            <div class="space-y-6 mb-8">
                
                <!-- Length Slider (NO LAG: Only updates UI text on drag) -->
                <div class="bg-black/50 p-4 rounded-xl border border-slate-800">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-ruler-horizontal text-cyber-neonCyan"></i> Длина пароля:
                        </label>
                        <span id="length-val" class="text-2xl font-black font-orbitron text-cyber-neonCyan text-glow-cyan">16</span>
                    </div>
                    <input type="range" id="length-slider" min="6" max="64" value="16" class="w-full">
                </div>

                <!-- Symbols Selectors -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    
                    <label class="flex items-center justify-between p-3 bg-black/40 border border-slate-800 rounded-xl hover:border-cyber-neonCyan/50 transition cursor-pointer">
                        <span class="text-sm text-slate-300 font-semibold">Заглавные буквы (A-Z)</span>
                        <input type="checkbox" id="inc-uppercase" class="cyber-checkbox" checked>
                    </label>

                    <label class="flex items-center justify-between p-3 bg-black/40 border border-slate-800 rounded-xl hover:border-cyber-neonCyan/50 transition cursor-pointer">
                        <span class="text-sm text-slate-300 font-semibold">Строчные буквы (a-z)</span>
                        <input type="checkbox" id="inc-lowercase" class="cyber-checkbox" checked>
                    </label>

                    <label class="flex items-center justify-between p-3 bg-black/40 border border-slate-800 rounded-xl hover:border-cyber-neonCyan/50 transition cursor-pointer">
                        <span class="text-sm text-slate-300 font-semibold">Цифры (0-9)</span>
                        <input type="checkbox" id="inc-numbers" class="cyber-checkbox" checked>
                    </label>

                    <label class="flex items-center justify-between p-3 bg-black/40 border border-slate-800 rounded-xl hover:border-cyber-neonCyan/50 transition cursor-pointer">
                        <span class="text-sm text-slate-300 font-semibold">Спецсимволы (!@#$)</span>
                        <input type="checkbox" id="inc-symbols" class="cyber-checkbox" checked>
                    </label>

                </div>

            </div>

            <!-- Action Button -->
            <button id="generate-btn" class="w-full py-4 bg-gradient-to-r from-cyber-neonCyan via-cyber-neonPink to-cyber-neonPurple hover:brightness-125 text-black font-orbitron font-black text-lg tracking-wider uppercase rounded-xl glow-btn transition-all active:scale-[0.98] flex items-center justify-center gap-3 mb-8">
                <i class="fa-solid fa-bolt-lightning text-xl"></i> Сгенерировать пароли
            </button>

            <!-- Results Section (Multiple Passwords List) -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-cyber-neonPink"></i> Варианты паролей на выбор:
                    </span>
                    <span class="text-xs text-slate-500">Нажмите на любой для копирования</span>
                </div>

                <div id="password-list" class="space-y-3">
                    <!-- Dynamic password cards will be inserted here -->
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-600 font-mono">
        CYBERPASS SYSTEM // HTML5 & TAILWIND CSS
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const charSets = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        const lengthSlider = document.getElementById('length-slider');
        const lengthVal = document.getElementById('length-val');
        const incUppercase = document.getElementById('inc-uppercase');
        const incLowercase = document.getElementById('inc-lowercase');
        const incNumbers = document.getElementById('inc-numbers');
        const incSymbols = document.getElementById('inc-symbols');
        const generateBtn = document.getElementById('generate-btn');
        const passwordList = document.getElementById('password-list');
        const toast = document.getElementById('toast');

        // Smooth UI update on slider change (NO generate triggered to prevent lag)
        lengthSlider.addEventListener('input', (e) => {
            lengthVal.textContent = e.target.value;
        });

        // Ensure at least one option is selected
        const checkboxes = [incUppercase, incLowercase, incNumbers, incSymbols];
        checkboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                if (!checkboxes.some(c => c.checked)) {
                    cb.checked = true;
                }
            });
        });

        // Crypto Secure Single Password Generator
        function createSinglePassword(length, pool) {
            const array = new Uint32Array(length);
            window.crypto.getRandomValues(array);
            let result = '';
            for (let i = 0; i < length; i++) {
                result += pool[array[i] % pool.length];
            }
            return result;
        }

        // Strength Evaluator
        function getStrength(pwd) {
            let score = 0;
            if (pwd.length >= 10) score++;
            if (pwd.length >= 16) score++;
            if (pwd.length >= 24) score++;
            if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            if (score <= 2) return { text: 'СЛАБЫЙ', color: 'text-cyber-neonPink', border: 'border-cyber-neonPink/40', bg: 'bg-cyber-neonPink/10' };
            if (score <= 4) return { text: 'СРЕДНИЙ', color: 'text-cyber-neonYellow', border: 'border-cyber-neonYellow/40', bg: 'bg-cyber-neonYellow/10' };
            if (score <= 5) return { text: 'НАДЕЖНЫЙ', color: 'text-cyber-neonCyan', border: 'border-cyber-neonCyan/40', bg: 'bg-cyber-neonCyan/10' };
            return { text: 'КВАНТОВЫЙ', color: 'text-cyber-neonGreen', border: 'border-cyber-neonGreen/40', bg: 'bg-cyber-neonGreen/10' };
        }

        // Generate Multiple Passwords
        function generatePasswords() {
            let pool = '';
            if (incUppercase.checked) pool += charSets.uppercase;
            if (incLowercase.checked) pool += charSets.lowercase;
            if (incNumbers.checked) pool += charSets.numbers;
            if (incSymbols.checked) pool += charSets.symbols;

            const length = parseInt(lengthSlider.value);
            passwordList.innerHTML = '';

            // Generate 4 variants
            for (let i = 0; i < 4; i++) {
                const password = createSinglePassword(length, pool);
                const strength = getStrength(password);

                const card = document.createElement('div');
                card.className = `flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-black/60 border ${strength.border} rounded-xl hover:bg-black/80 transition-all gap-3 group`;

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center gap-3 overflow-hidden">
                        <span class="text-xs px-2 py-0.5 rounded font-bold ${strength.bg} ${strength.color} border ${strength.border} shrink-0 w-fit">
                            ${strength.text}
                        </span>
                        <span class="font-mono text-base sm:text-lg text-white font-bold break-all select-all tracking-wider">${password}</span>
                    </div>
                    <button onclick="copyToClipboard('${password}')" class="px-4 py-2 bg-cyber-neonCyan/10 hover:bg-cyber-neonCyan text-cyber-neonCyan hover:text-black border border-cyber-neonCyan/50 rounded-lg font-semibold text-xs transition-all active:scale-95 shrink-0 flex items-center justify-center gap-2">
                        <i class="fa-regular fa-copy"></i>
                        <span>Копировать</span>
                    </button>
                `;

                passwordList.appendChild(card);
            }
        }

        // Toast Notification Function
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                toast.classList.remove('translate-x-72', 'opacity-0');
                toast.classList.add('translate-x-0', 'opacity-100');

                setTimeout(() => {
                    toast.classList.remove('translate-x-0', 'opacity-100');
                    toast.classList.add('translate-x-72', 'opacity-0');
                }, 2000);
            });
        }

        // Events
        generateBtn.addEventListener('click', generatePasswords);

        // Initial generation on page load
        generatePasswords();
    </script>
</body>
</html>
